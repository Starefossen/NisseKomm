[tools]
node = "24"
pnpm = "10"

[tasks.dev]
description = "Start NisseKomm dev-server i lokal testmodus"
run = """
#!/usr/bin/env bash
set -euo pipefail
DAY="${MOCK_DAY:-10}"
cat <<EOF
================================================================================
🎄 NISSEKOMM 2026: OPERASJON SPØKELSESKODE (DEV SERVER)
================================================================================
🌐 URL-er:
   • Hovedterminal (Barna)   : http://localhost:3000
   • Foreldreguide (Nissemor): http://localhost:3000/nissemor-guide
   • Utvikler- & Testpanel   : http://localhost:3000/nissemor-guide/utvikling
   • Utskrift & Symbolkort   : http://localhost:3000/nissemor-guide/printout

🔑 Innlogging (fungerer direkte i localStorage-modus):
   • Barnekode (Hovedskjerm) : snø lykt rein
   • Foreldrekode (Guide)    : NORDPOL-DEV2026

📺 Testing av Snøfall TV & Dager:
   • Bruk «⏱ TIDSMASKIN» nede til høyre for å bytte dag og klokkeslett.
   • Eller start med valgt dag: MOCK_DAY=21 mise run dev (nåværende: Dag ${DAY})
   • Hele sesongen automatisk: mise run test:gjennomspilling
================================================================================
EOF
if DB=$(mise run dev:pg 2>/dev/null | tail -1); then export "$DB"
else echo "Postgres utilgjengelig (Colima kjører ikke) – bruker filbutikk"; export DEV_STORE_FILE="${DEV_STORE_FILE:-.data/dev-store.json}"; fi
KID_CODE="${KID_CODE:-snø lykt rein}" \
PARENT_CODE="${PARENT_CODE:-NORDPOL-DEV2026}" \
NISSEKOMM_MODE="${NISSEKOMM_MODE:-lan}" \
MCP_DEV_TOKEN="${MCP_DEV_TOKEN:-parent:parenttoken1}" \
NEXT_PUBLIC_TEST_MODE=true \
NEXT_PUBLIC_BOOT_ANIMATION_DURATION=0 \
NEXT_PUBLIC_MOCK_MONTH=12 \
NEXT_PUBLIC_MOCK_DAY="${DAY}" \
pnpm dev ${PORT:+-p $PORT}
"""


